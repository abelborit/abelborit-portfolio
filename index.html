    <!-- el tema se aplica antes de pintar la página para evitar el parpadeo (modo elegido antes por el usuario o, si no hay, el de su sistema) -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {
          /* localStorage no disponible: se usa el modo oscuro */
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#FFFFFF" : "#060E1B");
      })();
    </script>
